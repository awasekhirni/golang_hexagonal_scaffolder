# generated-api/resources/openapi.yaml
# OpenAPI 3.0 spec for the reference API. Since 1.4.0.
openapi: 3.0.3
info:
  title: Hexagonal Scaffolder Reference API
  version: 1.4.0
  license:
    name: Apache-2.0
servers:
  - url: http://localhost:8080
paths:
  /health:
    get:
      summary: Combined health (runtime + DB)
      responses:
        "200": { description: healthy }
        "503": { description: DB unavailable }
  /health/live:
    get:
      summary: Liveness probe (runtime only)
      responses:
        "200": { description: alive }
  /health/ready:
    get:
      summary: Readiness probe (DB SELECT 1)
      responses:
        "200": { description: ready }
        "503": { description: not ready }
  /metrics:
    get:
      summary: Prometheus metrics
      responses:
        "200": { description: prometheus text }
  /auth/token:
    post:
      summary: Issue a JWT (dev only)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        "200":
          description: token issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  expires_in: { type: integer }
  /users:
    get:
      summary: List users
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
    post:
      summary: Create a user
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserInput" }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /users/{id}:
    get:
      summary: Get a user by id
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      summary: Update a user
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserInput" }
      responses:
        "200":
          description: updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      summary: Delete a user
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: deleted }
        "404": { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Error:
      description: error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        name: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    UserInput:
      type: object
      required: [email, name]
      properties:
        email: { type: string, format: email }
        name: { type: string }
    Error:
      type: object
      properties:
        code: { type: string, example: API-002 }
        message: { type: string }
        reqId: { type: string, format: uuid }
